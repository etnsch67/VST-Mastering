name: Build installers

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build VST3
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Build installer
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows.iss
      - uses: actions/upload-artifact@v4
        with:
          name: MonsterClone-Windows-Installer
          path: dist/MonsterClone-Windows-Setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build VST3 (Intel + Apple Silicon)
        run: |
          cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release
      - name: Build installer
        run: |
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 dist
          cp -R "build/MonsterClone_artefacts/Release/VST3/Monster Clone.vst3" pkgroot/Library/Audio/Plug-Ins/VST3/
          pkgbuild --root pkgroot --identifier com.monsterclone.vst3 --version 0.1.0 --install-location / dist/MonsterClone-macOS.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: MonsterClone-macOS-Installer
          path: dist/MonsterClone-macOS.pkg
